<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine Alice</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="containerContents">
            <div class="title">
                <h2>🎰 Slot Machine Alice 🎰</h2>
            </div>

            <div id="results">Boa sorte!</div>

            <div class="images">
                <img class="slots slot-1" src="./images/a001.gif" alt="">
                <img class="slots slot-2" src="./images/a002.gif" alt="">
                <img class="slots slot-3" src="./images/a003.gif" alt="">
                <img class="slots slot-4" src="./images/a004.gif" alt="">
                <img class="slots slot-5" src="./images/a005.gif" alt="">
                <img class="slots slot-6" src="./images/a006.gif" alt="">
                <img class="slots slot-7" src="./images/a007.gif" alt="">
                <img class="slots slot-8" src="./images/a008.gif" alt="">
                <img class="slots slot-9" src="./images/a009.gif" alt="">
            </div>

            <div class="controls">
                <div class="credits">
                    <label>Créditos:</label>
                    <input type="number" id="creditos" value="100" readonly>
                </div>
                <div class="bet">
                    <label>Aposta:</label>
                    <input type="number" id="aposta" value="10" min="1" max="100">
                </div>
                <div class="winnings">
                    <label>Ganhos:</label>
                    <input type="number" id="ganhos" value="0" readonly>
                </div>
                <div class="plays">
                    <label>Jogadas:</label>
                    <input type="number" id="jogadas" value="0" readonly>
                </div>
            </div>

            <button onclick="multiplicador()">Jogar 🎲</button>
        </div>
    </div>

    <!-- Container de GIFs (vitória / derrota / 10 derrotas) -->
    <div id="gif-container">
        <img id="gif-display" src="" alt="Resultado">
    </div>

    <script src="index.js"></script>
</body>
</html>
