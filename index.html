<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Machine Misael</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="containerContents">
      <div class="title">
        <h2>🎰 Slot Machine</h2>
      </div>

      <div id="results">Boa sorte!</div>

      <div class="images">
        <img class="slots slot-1" src="./images/a001.gif">
        <img class="slots slot-2" src="./images/a002.gif">
        <img class="slots slot-3" src="./images/a003.gif">
        <img class="slots slot-4" src="./images/a004.gif">
        <img class="slots slot-5" src="./images/a005.gif">
        <img class="slots slot-6" src="./images/a006.gif">
        <img class="slots slot-7" src="./images/a007.gif">
        <img class="slots slot-8" src="./images/a008.gif">
        <img class="slots slot-9" src="./images/a009.gif">
      </div>

      <button onclick="multiplicador()">🎲 Girar</button>
      <button class="comprar" onclick="comprarCreditos()">💵 Comprar Créditos</button>

      <div class="credits">
        <label for="creditos">Créditos:</label>
        <input type="text" id="creditos" value="100" readonly>
      </div>
    </div>
  </div>

  <div id="gifContainer" class="gif-container"></div>

  <script src="index.js"></script>
</body>
</html>
