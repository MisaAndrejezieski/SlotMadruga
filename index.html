<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Anime</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="containerContents">
      <!-- Título -->
      <div class="title">
        <h2>Slot Anime</h2>
      </div>

      <!-- Resultado -->
      <div id="results">Jogar</div>

      <!-- Área dos Slots -->
      <div class="images">
        <img class="slots slot-1" src="./images/a001.gif" alt="Slot 1">
        <img class="slots slot-2" src="./images/a002.gif" alt="Slot 2">
        <img class="slots slot-3" src="./images/a003.gif" alt="Slot 3">
        <img class="slots slot-4" src="./images/a004.gif" alt="Slot 4">
        <img class="slots slot-5" src="./images/a005.gif" alt="Slot 5">
        <img class="slots slot-6" src="./images/a006.gif" alt="Slot 6">
        <img class="slots slot-7" src="./images/a007.gif" alt="Slot 7">
        <img class="slots slot-8" src="./images/a008.gif" alt="Slot 8">
        <img class="slots slot-9" src="./images/a009.gif" alt="Slot 9">
      </div>

      <!-- Controles -->
      <div class="controls">
        <div class="credits">
          <label for="creditos">Créditos:</label>
          <input type="number" id="creditos" value="10000" readonly>
        </div>
        <div class="bet">
          <label for="aposta">Aposta:</label>
          <input type="number" id="aposta" value="1" min="1" max="10">
        </div>
        <div class="winnings">
          <label for="ganhos">Ganhos:</label>
          <input type="number" id="ganhos" value="0" readonly>
        </div>
        <div class="plays">
          <label for="jogadas">Jogadas:</label>
          <input type="number" id="jogadas" value="0" readonly>
        </div>
      </div>

      <!-- Botão -->
      <button type="button" id="botao" onclick="multiplicador()">Jogar</button>
    </div>

    <!-- GIFs de feedback -->
    <div id="gifFeedback" class="gifFeedback"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
